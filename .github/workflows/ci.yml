name: CI

# Fast checks for pull requests. The Swift build, tests, signing and packaging
# run locally in script/verify_release.sh before every release.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install zsh
        run: sudo apt-get install -y --no-install-recommends zsh

      - name: Scripts and documentation links
        run: |
          zsh -n Brand/scripts/*.sh script/*.sh script/*.zsh
          ./script/validate_agent_workspace.sh

      - name: Python scripts
        run: |
          python3 script/benchmark_contextual_dictation.py --validate
          python3 script/test_contextual_benchmark.py
          python3 script/test_capture_latency_report.py

      - name: Website
        working-directory: site
        run: |
          npm ci
          npm run lint
          npm run build
          npm test
